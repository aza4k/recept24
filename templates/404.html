<!DOCTYPE html>
<html lang="kaa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Бет табылмады | Recept24</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1e40af;
            --primary-hover: #1d4ed8;
            --text-main: #0f172a;
            --text-muted: #475569;
            --bg-base: #f8fafc;
            --card-border: #cbd5e1;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .error-card {
            background: #ffffff;
            border: 1px solid var(--card-border);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
            max-width: 520px;
            width: 100%;
            padding: 48px 36px;
            text-align: center;
        }
        .error-code {
            font-size: 88px;
            font-weight: 900;
            line-height: 1;
            color: var(--primary);
            letter-spacing: -2px;
            margin-bottom: 12px;
        }
        .error-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 12px;
        }
        .error-desc {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .actions {
            display: flex;
            justify-content: center;
            gap: 14px;
        }
        .btn-home {
            background-color: var(--primary);
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s;
        }
        .btn-home:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">404</div>
        <h1 class="error-title">Бет табылмады</h1>
        <p class="error-desc">
            Сиз излеген бет өширилген, мәнзили өзгертилген яки ўақытша ислемей атырған болыўы мүмкин.
        </p>
        <div class="actions">
            <a href="/" class="btn-home">
                <i class="fa-solid fa-house"></i> Бас бетке қайтыў
            </a>
        </div>
    </div>
</body>
</html>
